<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Thanks for installing - AdBlock for ChatGPT</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: light-dark(#111111, #f2f2f2);
        --muted: light-dark(#555555, #a8a8a8);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: var(--text);
      }

      main {
        width: min(100%, 36rem);
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      header img {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }

      header h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.25;
      }

      p {
        margin: 0 0 1rem;
        font-size: 1rem;
        line-height: 1.55;
        color: var(--muted);
      }

      p:last-child {
        margin-bottom: 0;
      }

      .lead {
        color: var(--text);
        font-size: 1.05rem;
      }

      a {
        color: inherit;
        text-underline-offset: 2px;
      }

      a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon48.png" alt="" width="40" height="40" />
        <h1>AdBlock for ChatGPT</h1>
      </header>
      <p class="lead">
        Thanks for installing! I hope you enjoy an ad-free ChatGPT
        experience!
      </p>
      <p>
        This extension is completely free and always will be. It respects your
        privacy and never collects your data. The source is
        <a
          href="https://github.com/piotrpaluczak/AdBlock-for-ChatGPT"
          target="_blank"
          rel="noopener noreferrer"
          >open on GitHub</a
        >.
      </p>
      <p>
        If you enjoy using it, please consider
        <a
          href="https://buymeacoffee.com/piotrpaluczak"
          target="_blank"
          rel="noopener noreferrer"
          >buying me a coffee</a
        >. ☕
      </p>
    </main>
  </body>
</html>
