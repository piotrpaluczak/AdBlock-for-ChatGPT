<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>AdBlock for ChatGPT</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: light-dark(#111111, #f2f2f2);
        --muted: light-dark(#555555, #a8a8a8);
        --accent: light-dark(#0b57d0, #8ab4f8);
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 12px 16px;
        min-width: 200px;
        color: var(--text);
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        accent-color: var(--accent);
      }

      p {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="enabled" />
      Block ads
    </label>
    <p>Hides ad blocks in ChatGPT chats.</p>
    <script src="popup.js"></script>
  </body>
</html>
