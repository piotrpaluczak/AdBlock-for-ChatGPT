<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extensionName">AdBlock for ChatGPT</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: light-dark(#111111, #f2f2f2);
        --muted: light-dark(#555555, #a8a8a8);
        --accent: #10a37f;
        --track-off: light-dark(#c6c6c6, #5a5a5a);
        --thumb: #ffffff;
        --border: light-dark(#e5e5e5, #333333);
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 14px 16px 12px;
        min-width: 260px;
        color: var(--text);
      }

      header {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        column-gap: 10px;
        row-gap: 8px;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      header img {
        width: 32px;
        height: 32px;
        border-radius: 6px;
      }

      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.25;
        min-width: 0;
      }

      header .subtitle {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .state {
        font-size: 14px;
        font-weight: 400;
        color: var(--text);
        line-height: 1.25;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }

      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }

      .switch .track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--track-off);
        transition: background-color 0.15s ease;
        pointer-events: none;
      }

      .switch .track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--thumb);
        box-shadow: 0 1px 2px rgb(0 0 0 / 25%);
        transition: transform 0.15s ease;
      }

      .switch input:checked + .track {
        background: var(--accent);
      }

      .switch input:checked + .track::after {
        transform: translateX(18px);
      }

      .switch input:focus-visible + .track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .stat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 0 0 44px;
        font-size: 12px;
        line-height: 1.35;
        color: var(--muted);
      }

      .stat-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        flex-shrink: 0;
      }

      .stat-value[data-empty="true"] {
        font-weight: 400;
        color: var(--muted);
      }

      .support {
        display: flex;
        flex-direction: column;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }

      .support p {
        margin: 0;
      }

      .support .more {
        margin-top: 10px;
      }

      .support a {
        color: inherit;
        text-underline-offset: 2px;
      }

      .support a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="32" height="32" />
      <h1 id="extension-title" data-i18n="extensionName">AdBlock for ChatGPT</h1>
      <div class="toggle">
        <span class="state" id="enabled-state" aria-hidden="true">Off</span>
        <label class="switch">
          <input
            type="checkbox"
            id="enabled"
            role="switch"
            aria-labelledby="extension-title"
            aria-checked="false"
          />
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>
      <p class="subtitle" data-i18n="popupSubtitle">Block ads in ChatGPT chats.</p>
    </header>
    <div class="stat" aria-live="polite">
      <span id="blocked-label" data-i18n="popupBlockedLabel">Ads blocked on this page</span>
      <span class="stat-value" id="blocked-count" data-empty="true">—</span>
    </div>
    <div class="support">
      <p data-i18n="popupSupport">
        Enjoying it? Consider
        <a
          href="https://buymeacoffee.com/piotrpaluczak"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-link="popupSupportLink"
          >buying me a coffee</a
        >. ☕
      </p>
      <a
        class="more"
        href="thank-you.html"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="popupLearnMore"
        >Learn more</a
      >
    </div>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
